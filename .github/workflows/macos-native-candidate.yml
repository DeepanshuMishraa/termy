name: macOS Native Candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric candidate version (for example 0.2.14)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: macos-native-candidate-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

env:
  CANDIDATE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  build-native-candidate:
    name: Native candidate (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode with Swift 6.2
        run: |
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Selecting ${xcode_app}"
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Validate authoritative version
        run: |
          version="${CANDIDATE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Candidate version must be numeric semver: $CANDIDATE_VERSION" >&2
            exit 1
          }
          source_version="$(awk '/^version = / { gsub(/"/, "", $3); print $3; exit }' crates/desktop_app/Cargo.toml)"
          [[ "$version" == "$source_version" ]] || {
            echo "Candidate version $version does not match source version $source_version" >&2
            exit 1
          }
          echo "CANDIDATE_VERSION_NORMALIZED=$version" >> "$GITHUB_ENV"

      - name: Build unsigned native DMG
        run: >-
          ./macos/scripts/build-dmg.sh
          --version "$CANDIDATE_VERSION_NORMALIZED"
          --arch "${{ matrix.arch }}"
          --target "${{ matrix.target }}"
          --no-layout

      - name: Re-run candidate and CLI gates
        run: |
          dmg="macos/dist/Termy-${CANDIDATE_VERSION_NORMALIZED}-macos-${{ matrix.arch }}.dmg"
          ./macos/scripts/check-release-readiness.sh \
            --dmg "$dmg" \
            --arch "${{ matrix.arch }}" \
            --version "$CANDIDATE_VERSION_NORMALIZED"
          ./macos/scripts/check-cli-install-smoke.sh \
            --app "macos/.build/dmg-${{ matrix.arch }}/Termy.app"

      - name: Run candidate performance and interaction gates
        env:
          TERMY_RENDER_BENCHMARK_BINARY: ${{ github.workspace }}/macos/.build/dmg-${{ matrix.arch }}/Termy.app/Contents/MacOS/Termy
          TERMY_RENDER_REPORT_PATH: ${{ github.workspace }}/macos/dist/native-render-${{ matrix.arch }}.json
        run: |
          app="macos/.build/dmg-${{ matrix.arch }}/Termy.app"
          ./macos/scripts/check-render-perf.sh --skip-build
          ./macos/scripts/check-launch-gate.sh \
            --app "$app" \
            --output "macos/dist/native-launch-${{ matrix.arch }}.json"
          ./macos/scripts/check-native-soak.sh \
            --app "$app" \
            --duration-seconds 30 \
            --minimum-cycles 30 \
            --output "macos/dist/native-soak-${{ matrix.arch }}.json"

      - name: Record checksum and build metadata
        run: |
          dmg="macos/dist/Termy-${CANDIDATE_VERSION_NORMALIZED}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "$dmg" > "${dmg}.sha256"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "version=$CANDIDATE_VERSION_NORMALIZED"
            echo "architecture=${{ matrix.arch }}"
            echo "target=${{ matrix.target }}"
            echo "rustc=$(rustc --version)"
            echo "swift=$(swift --version | head -n 1)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
          } > "macos/dist/native-candidate-${{ matrix.arch }}.metadata"

      - name: Upload unpublished native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termy-native-candidate-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            macos/dist/Termy-*-macos-${{ matrix.arch }}.dmg
            macos/dist/Termy-*-macos-${{ matrix.arch }}.dmg.sha256
            macos/dist/native-candidate-${{ matrix.arch }}.metadata
            macos/dist/native-render-${{ matrix.arch }}.json
            macos/dist/native-launch-${{ matrix.arch }}.json
            macos/dist/native-soak-${{ matrix.arch }}.json
            macos/dist/native-soak-${{ matrix.arch }}.log
          if-no-files-found: error
          retention-days: 30
