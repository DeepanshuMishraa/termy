name: macOS Native Soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Soak duration per architecture (7200 = two hours)
        required: true
        default: "7200"
        type: string

permissions:
  contents: read

concurrency:
  group: macos-native-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-soak:
    name: Native soak (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode with Swift 6.2
        run: |
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          swift --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build native candidate
        run: >-
          ./macos/scripts/build-dmg.sh
          --arch "${{ matrix.arch }}"
          --target "${{ matrix.target }}"
          --no-layout

      - name: Run native soak
        run: |
          minimum_cycles=$(( ${{ inputs.duration_seconds }} / 2 ))
          (( minimum_cycles >= 100 )) || minimum_cycles=100
          ./macos/scripts/check-native-soak.sh \
            --app "macos/.build/dmg-${{ matrix.arch }}/Termy.app" \
            --duration-seconds "${{ inputs.duration_seconds }}" \
            --minimum-cycles "$minimum_cycles" \
            --output "$GITHUB_WORKSPACE/native-soak-${{ matrix.arch }}.json"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termy-native-soak-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            native-soak-${{ matrix.arch }}.json
            native-soak-${{ matrix.arch }}.log
          if-no-files-found: warn
          retention-days: 30
